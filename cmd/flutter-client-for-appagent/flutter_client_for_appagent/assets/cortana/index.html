<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

#details { position: fixed; left: 10px; right: 10px; bottom: 10px; max-height: 38vh;
  overflow: auto; white-space: pre-wrap; color: #d7e3ff; font-size: 11px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  padding: 10px 12px; background: rgba(0,0,0,0.62); border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.12); }

<body>
<div id="status">Initializing...</div>
<div id="details">Booting Cortana diagnostics...</div>
<script src="./vendor/pixi.min.js"></script>
<script src="./vendor/live2dcubismcore.min.js"></script>
<script src="./vendor/cubism4.min.js"></script>
<script>
const detailsEl = document.getElementById('details');
const statusEl = document.getElementById('status');
const detailLines = [];
let diagnosticsVisible = false;

function postToFlutter(payload) {
  try {
    if (window.flutter_inappwebview && typeof window.flutter_inappwebview.callHandler === 'function') {
      window.flutter_inappwebview.callHandler('cortanaLog', payload);
    }
  } catch (_) {}
}

function appendDetail(msg) {
  const line = `[${new Date().toISOString()}] ${msg}`;
  detailLines.push(line);
  if (detailLines.length > 120) {
    detailLines.shift();
  }
  detailsEl.textContent = detailLines.join('\n');
}

function applyDiagnosticsVisibility(visible) {
  diagnosticsVisible = !!visible;
  detailsEl.style.display = diagnosticsVisible ? 'block' : 'none';
  statusEl.style.display = diagnosticsVisible ? 'block' : 'none';
}

const log = (msg) => {
  const full = '[Cortana] ' + msg;
  console.log(full);
  appendDetail(msg);
  postToFlutter(full);
  statusEl.textContent = msg;
};

window.PIXI = window.PIXI || PIXI;

const MODEL_URL = window.CORTANA_MODEL_URL || './model/haru/haru_greeter_t03.model3.json';
const defaultExpressionMap = {
  happy: 'f04',
  sad: 'f03',
  surprised: 'f05',
};
const motionMap = {
  TapBody: ['Tap', 0],
  Tap: ['Tap', 0],
  Idle: ['Idle', 0],
  IdleAlt: ['Idle', 1],
  IdleWave: ['Idle', 2],
};
const motionTransitionConfig = {
  fadeInMs: 900,
  fadeOutMs: 900,
  idleFadeMs: 1100,
};
const motionIntentProfiles = {
  idle: {
    aliases: ['idle', 'calm', 'listen', 'listening'],
    include: ['default', 'yurayura', 'pose', 'nod'],
    exclude: ['face_', 'armescape', 'additional', 'angry', 'sad', 'trouble', 'cry'],
    fallback: ['Idle', 0],
  },
  greeting: {
    aliases: ['greeting', 'welcome', 'hello', 'wave'],
    include: ['greeting', 'shakehand', 'forward', 'glad', 'posenod'],
    exclude: ['face_', 'angry', 'sad', 'trouble', 'cry'],
    fallback: ['IdleWave', 0],
  },
  happy: {
    aliases: ['happy', 'joy', 'warm', 'playful', 'celebrate'],
    include: ['glad', 'smile', 'wink', 'delicious', 'forward'],
    exclude: ['face_', 'angry', 'sad', 'trouble', 'cry', 'tired'],
    fallback: ['IdleWave', 0],
  },
  thinking: {
    aliases: ['thinking', 'think', 'explain', 'explaincalm', 'calm_explain'],
    include: ['think', 'tilthead', 'lookaway', 'fidget', 'pose'],
    exclude: ['face_', 'angry', 'cry', 'sleep'],
    fallback: ['IdleAlt', 0],
  },
  question: {
    aliases: ['question', 'curious', 'ask', 'listen_question'],
    include: ['tilthead', 'nodtilthead', 'lookaway', 'posetilthead'],
    exclude: ['face_', 'angry', 'cry'],
    fallback: ['IdleAlt', 0],
  },
  emphasis: {
    aliases: ['emphasis', 'alert', 'important', 'strong', 'notice'],
    include: ['purpose', 'forward', 'shakehand', 'nod', 'angry'],
    exclude: ['face_', 'sleep', 'cry'],
    fallback: ['Tap', 0],
  },
  apology: {
    aliases: ['apology', 'sorry', 'comfort', 'soothe'],
    include: ['trouble', 'sad', 'relief', 'shy', 'sigh'],
    exclude: ['face_', 'angry'],
    fallback: ['IdleAlt', 0],
  },
  sad: {
    aliases: ['sad', 'regret', 'low'],
    include: ['sad', 'trouble', 'sigh', 'relief'],
    exclude: ['face_', 'angry'],
    fallback: ['IdleAlt', 0],
  },
  face_happy: {
    aliases: ['face_happy', 'face_smile', 'smile'],
    include: ['face_smile', 'face_blush'],
    exclude: [],
    fallback: ['IdleWave', 0],
  },
  face_sad: {
    aliases: ['face_sad', 'face_cry'],
    include: ['face_sad', 'face_cry', 'face_worry', 'face_tired'],
    exclude: [],
    fallback: ['IdleAlt', 0],
  },
  face_surprised: {
    aliases: ['face_surprised', 'face_surprise', 'surprised'],
    include: ['face_surprise', 'face_shock'],
    exclude: [],
    fallback: ['Tap', 0],
  },
};
const motionIntentAliases = {};
Object.keys(motionIntentProfiles).forEach((key) => {
  motionIntentAliases[key] = key;
  (motionIntentProfiles[key].aliases || []).forEach((alias) => {
    motionIntentAliases[alias] = key;
  });
});

let app, model;
let initStartedAt = Date.now();
let lastModelConfig = null;
let lastResourceStatuses = [];
let lastInitError = null;
let resolvedModelUrl = null;
let actionReady = false;
let motionQueue = Promise.resolve();
let lastAppliedMotion = null;
let lastQueuedMotion = null;
let recentMotionNames = [];
let lastMotionRequestedAt = 0;
let lastPointerMotionAt = 0;
let lastLayoutLogAt = 0;
let modelLayoutMetrics = null;
let availableExpressionNames = [];
let availableMotionEntries = [];
const userViewState = {
  scale: 1,
  offsetX: 0,
  offsetY: 0,
};
const containerViewState = {
  mode: 'fullscreen',
};
const speechFocusState = {
  active: false,
  progress: 0,
  from: 0,
  to: 0,
  startedAt: 0,
  durationMs: 520,
  targetScale: 1.26,
  targetOffsetX: 0,
  targetOffsetY: 0.15,
  rafId: 0,
};
const idleFocusState = {
  active: false,
  progress: 0,
  from: 0,
  to: 0,
  startedAt: 0,
  durationMs: 1200,
  targetScale: 1.1,
  targetOffsetX: 0,
  targetOffsetY: 0.04,
  rafId: 0,
};
const lipSyncState = {
  current: 0,
  target: 0,
  lastTs: 0,
  rafId: 0,
};
const speechMotionState = {
  active: false,
  token: 0,
  timerId: 0,
  pollId: 0,
  lastStartedAt: 0,
};

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function easeInOutCubic(t) {
  if (t <= 0) {
    return 0;
  }
  if (t >= 1) {
    return 1;
  }
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function ensureLipSyncLoop() {
  if (lipSyncState.rafId) {
    return;
  }
  lipSyncState.lastTs = 0;
  const tick = (ts) => {
    if (!model || !model.internalModel || !model.internalModel.coreModel) {
      lipSyncState.rafId = 0;
      return;
    }
    const dt = lipSyncState.lastTs > 0 ? ts - lipSyncState.lastTs : 16;
    lipSyncState.lastTs = ts;
    const easing = clamp(dt / 180, 0.08, 0.32);
    lipSyncState.current += (lipSyncState.target - lipSyncState.current) * easing;
    const settled =
      Math.abs(lipSyncState.current - lipSyncState.target) < 0.01 &&
      lipSyncState.target < 0.01;
    try {
      model.internalModel.coreModel.setParameterValueById(
        'ParamMouthOpenY',
        clamp(lipSyncState.current, 0, 1)
      );
    } catch (_) {}
    if (settled) {
      lipSyncState.current = 0;
      lipSyncState.target = 0;
      lipSyncState.lastTs = 0;
      lipSyncState.rafId = 0;
      return;
    }
    lipSyncState.rafId = requestAnimationFrame(tick);
  };
  lipSyncState.rafId = requestAnimationFrame(tick);
}

function animateSpeechFocus(active) {
  speechFocusState.active = !!active;
  speechFocusState.from = speechFocusState.progress;
  speechFocusState.to = active ? 1 : 0;
  speechFocusState.startedAt = performance.now();
  if (speechFocusState.rafId) {
    cancelAnimationFrame(speechFocusState.rafId);
  }

  const step = (ts) => {
    const elapsed = ts - speechFocusState.startedAt;
    const progress = clamp(elapsed / speechFocusState.durationMs, 0, 1);
    const eased = easeInOutCubic(progress);
    speechFocusState.progress =
      speechFocusState.from +
      (speechFocusState.to - speechFocusState.from) * eased;
    layoutModel();
    if (progress < 1) {
      speechFocusState.rafId = requestAnimationFrame(step);
      return;
    }
    speechFocusState.progress = speechFocusState.to;
    speechFocusState.rafId = 0;
    layoutModel();
  };

  speechFocusState.rafId = requestAnimationFrame(step);
}

function animateIdleFocus(active) {
  idleFocusState.active = !!active;
  idleFocusState.from = idleFocusState.progress;
  idleFocusState.to = active ? 1 : 0;
  idleFocusState.startedAt = performance.now();
  if (idleFocusState.rafId) {
    cancelAnimationFrame(idleFocusState.rafId);
  }

  const step = (ts) => {
    const elapsed = ts - idleFocusState.startedAt;
    const progress = clamp(elapsed / idleFocusState.durationMs, 0, 1);
    const eased = easeInOutCubic(progress);
    idleFocusState.progress =
      idleFocusState.from +
      (idleFocusState.to - idleFocusState.from) * eased;
    layoutModel();
    if (progress < 1) {
      idleFocusState.rafId = requestAnimationFrame(step);
      return;
    }
    idleFocusState.progress = idleFocusState.to;
    idleFocusState.rafId = 0;
    layoutModel();
  };

  idleFocusState.rafId = requestAnimationFrame(step);
}

function layoutModel() {
  if (!app || !model) {
    return;
  }

  if (!modelLayoutMetrics) {
    modelLayoutMetrics = resolveModelLayoutMetrics();
    log(
      `Model bounds resolved: bounds=(${modelLayoutMetrics.boundsX.toFixed(2)}, ` +
      `${modelLayoutMetrics.boundsY.toFixed(2)}, ${modelLayoutMetrics.baseWidth.toFixed(2)}x` +
      `${modelLayoutMetrics.baseHeight.toFixed(2)}), pivot=(${modelLayoutMetrics.pivotX.toFixed(2)}, ` +
      `${modelLayoutMetrics.pivotY.toFixed(2)}), fallback=${modelLayoutMetrics.usedFallback}`
    );
  }

  const baseWidth = modelLayoutMetrics.baseWidth;
  const baseHeight = modelLayoutMetrics.baseHeight;

  const isFloating = containerViewState.mode !== 'fullscreen';
  const fitWidthFactor = isFloating ? 0.78 : 0.9;
  const fitHeightFactor = isFloating ? 0.82 : 0.96;
  const effectiveUserScale = isFloating
    ? Math.min(userViewState.scale, 1)
    : userViewState.scale;
  const effectiveOffsetX = isFloating ? 0 : userViewState.offsetX;
  const effectiveOffsetY = isFloating ? -0.08 : userViewState.offsetY;

  // 常态尽量给角色更多画面空间，语音播放时再进一步推近到上半身。
  const maxWidth = app.screen.width * fitWidthFactor;
  const maxHeight = app.screen.height * fitHeightFactor;
  const baseScale = Math.min(maxWidth / baseWidth, maxHeight / baseHeight);
  const speechScale = 1 + (speechFocusState.targetScale - 1) * speechFocusState.progress;
  const idleScale = 1 + (idleFocusState.targetScale - 1) * idleFocusState.progress;
  const scale = baseScale * effectiveUserScale * speechScale * idleScale;
  const offsetX =
    app.screen.width *
    (effectiveOffsetX +
      speechFocusState.targetOffsetX * speechFocusState.progress +
      idleFocusState.targetOffsetX * idleFocusState.progress);
  const offsetY =
    app.screen.height *
    (effectiveOffsetY +
      speechFocusState.targetOffsetY * speechFocusState.progress +
      idleFocusState.targetOffsetY * idleFocusState.progress);

  if (model.anchor && typeof model.anchor.set === 'function') {
    model.anchor.set(0, 0);
  }
  model.pivot.set(modelLayoutMetrics.pivotX, modelLayoutMetrics.pivotY);
  model.scale.set(scale);
  model.x = app.screen.width / 2 + offsetX;
  model.y = app.screen.height * 0.985 + offsetY;

  const now = performance.now();
  if (now - lastLayoutLogAt > 240) {
    lastLayoutLogAt = now;
    log(
      `Model laid out: base=${baseWidth.toFixed(2)}x${baseHeight.toFixed(2)}, ` +
      `screen=${app.screen.width}x${app.screen.height}, scale=${scale.toFixed(4)}, ` +
      `mode=${containerViewState.mode}, userScale=${userViewState.scale.toFixed(3)}, ` +
      `effectiveScale=${effectiveUserScale.toFixed(3)}, focus=${speechFocusState.progress.toFixed(3)}, ` +
      `idleFocus=${idleFocusState.progress.toFixed(3)}, ` +
      `pos=(${model.x.toFixed(1)}, ${model.y.toFixed(1)}), speechTargetY=${speechFocusState.targetOffsetY.toFixed(3)}`
    );
  }
}

function finitePositive(value) {
  return Number.isFinite(value) && value > 0;
}

function resolveModelLayoutMetrics() {
  let bounds = null;
  try {
    if (model && typeof model.getLocalBounds === 'function') {
      bounds = model.getLocalBounds();
    }
  } catch (e) {
    log(`Model bounds warning: ${e && e.message ? e.message : e}`);
  }

  const internalWidth = model && model.internalModel && model.internalModel.width;
  const internalHeight = model && model.internalModel && model.internalModel.height;
  const modelWidth = model && model.width;
  const modelHeight = model && model.height;
  const widthCandidates = [
    bounds && bounds.width,
    internalWidth,
    modelWidth,
  ];
  const heightCandidates = [
    bounds && bounds.height,
    internalHeight,
    modelHeight,
  ];
  const baseWidth = widthCandidates.find(finitePositive) || 1;
  const baseHeight = heightCandidates.find(finitePositive) || 1;
  const boundsX = bounds && Number.isFinite(bounds.x) ? bounds.x : 0;
  const boundsY = bounds && Number.isFinite(bounds.y) ? bounds.y : 0;
  const hasUsableBounds =
    bounds &&
    finitePositive(bounds.width) &&
    finitePositive(bounds.height);

  return {
    baseWidth,
    baseHeight,
    boundsX,
    boundsY,
    pivotX: hasUsableBounds ? boundsX + baseWidth / 2 : baseWidth / 2,
    pivotY: hasUsableBounds ? boundsY + baseHeight : baseHeight,
    usedFallback: !hasUsableBounds,
  };
}

function resourceUrl(relativePath) {
  const baseUrl = resolvedModelUrl || new URL(MODEL_URL, document.baseURI).toString();
  return new URL(relativePath, baseUrl).toString();
}

function configureLive2dMotionTiming() {
  const config = window.PIXI && window.PIXI.live2d && window.PIXI.live2d.config;
  if (!config) {
    log('Live2D motion timing config unavailable');
    return;
  }
  config.motionFadingDuration = motionTransitionConfig.fadeInMs;
  config.idleMotionFadingDuration = motionTransitionConfig.idleFadeMs;
  log(
    `Live2D motion timing: motionFade=${config.motionFadingDuration}ms, ` +
    `idleFade=${config.idleMotionFadingDuration}ms`
  );
}

function applyMotionFadeDefaultsToModelSettings() {
  const settings = model && model.internalModel && model.internalModel.settings;
  const motions = settings && settings.motions;
  if (!motions) {
    return;
  }
  Object.keys(motions).forEach((groupName) => {
    (motions[groupName] || []).forEach((item) => {
      if (!item || typeof item !== 'object') {
        return;
      }
      if (!(Number(item.FadeInTime) > 0)) {
        item.FadeInTime = motionTransitionConfig.fadeInMs / 1000;
      }
      if (!(Number(item.FadeOutTime) > 0)) {
        item.FadeOutTime = motionTransitionConfig.fadeOutMs / 1000;
      }
    });
  });
}

async function fetchStatus(url) {
  try {
    const response = await fetch(url, { cache: 'no-store' });
    const result = {
      url,
      ok: response.ok,
      status: response.status,
      statusText: response.statusText || '',
      contentType: response.headers.get('content-type') || '',
      contentLength: response.headers.get('content-length') || '',
    };
    log(`FETCH ${result.status} ${url} type=${result.contentType || '-'} len=${result.contentLength || '-'}`);
    return result;
  } catch (error) {
    const result = {
      url,
      ok: false,
      status: -1,
      statusText: error && error.message ? error.message : String(error),
      contentType: '',
      contentLength: '',
    };
    log(`FETCH ERROR ${url} reason=${result.statusText}`);
    return result;
  }
}

function collectModelResources(modelJson) {
  const refs = modelJson && modelJson.FileReferences ? modelJson.FileReferences : {};
  const resources = [];
  const push = (relativePath, kind, required = true) => {
    if (!relativePath) {
      return;
    }
    resources.push({ url: resourceUrl(relativePath), relativePath, kind, required });
  };
  push(refs.Moc, 'moc', true);
  push(refs.Physics, 'physics', false);
  push(refs.Pose, 'pose', false);
  push(refs.DisplayInfo, 'displayInfo', false);
  push(refs.UserData, 'userData', false);

  (refs.Textures || []).forEach((path, index) => push(path, `texture[${index}]`, true));
  (refs.Expressions || []).forEach((item, index) => push(item && item.File, `expression[${index}]`, false));

  const motions = refs.Motions || {};
  Object.keys(motions).forEach((groupName) => {
    (motions[groupName] || []).forEach((item, index) => {
      push(item && item.File, `motion.${groupName}[${index}]`, false);
      push(item && item.Sound, `motionSound.${groupName}[${index}]`, false);
    });
  });

  return resources;
}

function logWebglLimits() {
  try {
    const canvas = document.createElement('canvas');
    const gl =
      canvas.getContext('webgl') ||
      canvas.getContext('experimental-webgl');
    if (!gl) {
      log('WebGL unavailable while checking limits');
      return;
    }
    log(
      `WebGL limits: maxTextureSize=${gl.getParameter(gl.MAX_TEXTURE_SIZE)}, ` +
      `maxTextureUnits=${gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS)}`
    );
  } catch (e) {
    log(`WebGL limits check failed: ${e && e.message ? e.message : e}`);
  }
}

async function verifyRequiredResources() {
  log(`Page URL: ${window.location.href}`);
  log(`Base URI: ${document.baseURI}`);
  log(`UserAgent: ${navigator.userAgent}`);
  logWebglLimits();
  resolvedModelUrl = new URL(MODEL_URL, document.baseURI).toString();
  log(`Resolved model URL: ${resolvedModelUrl}`);
  lastResourceStatuses = [];

  const modelResponse = await fetchStatus(resolvedModelUrl);
  lastResourceStatuses.push({ kind: 'modelJson', relativePath: MODEL_URL, ...modelResponse });
  if (!modelResponse.ok) {
    throw new Error(`Model JSON cannot be fetched: ${MODEL_URL}`);
  }

  lastModelConfig = await fetch(resolvedModelUrl, { cache: 'no-store' }).then((r) => r.json());
  const expressionRefs =
    lastModelConfig &&
    lastModelConfig.FileReferences &&
    Array.isArray(lastModelConfig.FileReferences.Expressions)
      ? lastModelConfig.FileReferences.Expressions
      : [];
  availableExpressionNames = expressionRefs
    .map((item) => item && item.Name ? String(item.Name) : '')
    .filter(Boolean);
  log(`Available expressions: ${availableExpressionNames.length > 0 ? availableExpressionNames.join(', ') : 'none'}`);
  availableMotionEntries = collectMotionEntries(lastModelConfig);
  log(
    `Available motions: ${
      availableMotionEntries.length > 0
        ? availableMotionEntries.map((item) => `${item.group}[${item.index}]=${item.name}`).join(', ')
        : 'none'
    }`
  );
  const resources = collectModelResources(lastModelConfig);
  log(`Model resources discovered: ${resources.length}, name=${lastModelConfig.Name || lastModelConfig.name || 'unknown'}`);

  const missing = [];
  const requiredResources = resources.filter((resource) => resource.required);
  const optionalCount = resources.length - requiredResources.length;
  if (optionalCount > 0) {
    log(`Optional resources deferred until Live2D runtime load: ${optionalCount}`);
  }
  for (const resource of requiredResources) {
    const result = await fetchStatus(resource.url);
    lastResourceStatuses.push({ ...resource, ...result });
    if (!result.ok) {
      missing.push(`${resource.kind}: ${resource.relativePath}`);
    }
  }

  return { missing, resources };
}

function collectMotionEntries(modelJson) {
  const refs = modelJson && modelJson.FileReferences ? modelJson.FileReferences : {};
  const motions = refs.Motions || {};
  const entries = [];
  Object.keys(motions).forEach((groupName) => {
    (motions[groupName] || []).forEach((item, index) => {
      const file = item && item.File ? String(item.File) : '';
      const baseName = file.split(/[\\/]/).pop() || `${groupName}_${index}`;
      const name = baseName.replace(/\.motion3\.json$/i, '');
      entries.push({ group: groupName, index, name, file });
    });
  });
  return entries;
}

function pickRandom(items) {
  if (!items || items.length === 0) {
    return null;
  }
  return items[Math.floor(Math.random() * items.length)];
}

function randomInt(min, max) {
  return Math.floor(min + Math.random() * (max - min + 1));
}

function triggerPointerRandomMotion(reason) {
  const now = performance.now();
  if (now - lastPointerMotionAt < 360) {
    return;
  }
  lastPointerMotionAt = now;
  log(`Random motion trigger: ${reason}`);
  window.setMotion('random', 0).catch((e) => {
    log(`Random motion error: ${e && e.message ? e.message : e}`);
  });
}

function triggerStartupMotion() {
  setTimeout(() => {
    if (!actionReady || !model) {
      return;
    }
    log('Startup motion trigger: random');
    window.setMotion('random', 0).catch((e) => {
      log(`Startup motion error: ${e && e.message ? e.message : e}`);
    });
  }, 180);
}

function isSpeechMotionEligible(entry) {
  const name = `${entry.name} ${entry.group} ${entry.file}`.toLowerCase();
  return ![
    'face_',
    'sleep',
    'tired',
    'cry',
    'angry',
    'armescape',
    'additional',
  ].some((keyword) => name.includes(keyword));
}

function pickSpeechMotionTarget() {
  let candidates = availableMotionEntries.filter(isSpeechMotionEligible);
  if (candidates.length === 0) {
    candidates = availableMotionEntries.filter((entry) => {
      const name = `${entry.name} ${entry.group} ${entry.file}`.toLowerCase();
      return !name.includes('face_');
    });
  }
  if (candidates.length === 0) {
    candidates = availableMotionEntries;
  }
  if (candidates.length > 3) {
    const fresh = candidates.filter((entry) => !recentMotionNames.includes(entry.name));
    if (fresh.length > 0) {
      candidates = fresh;
    }
  }
  const picked = pickRandom(candidates);
  if (picked) {
    return [picked.group, picked.index, picked.name];
  }
  return resolveMotionIntent('thinking', '');
}

function isCurrentMotionFinished() {
  try {
    const manager = model && model.internalModel && model.internalModel.motionManager;
    if (manager && typeof manager.isFinished === 'function') {
      return manager.isFinished();
    }
  } catch (e) {
    log(`Motion finish check warning: ${e && e.message ? e.message : e}`);
  }
  return true;
}

function clearSpeechMotionTimers() {
  if (speechMotionState.timerId) {
    clearTimeout(speechMotionState.timerId);
    speechMotionState.timerId = 0;
  }
  if (speechMotionState.pollId) {
    clearTimeout(speechMotionState.pollId);
    speechMotionState.pollId = 0;
  }
}

function scheduleSpeechMotionNext(token, delayMs) {
  if (!speechMotionState.active || token !== speechMotionState.token) {
    return;
  }
  if (speechMotionState.timerId) {
    clearTimeout(speechMotionState.timerId);
  }
  speechMotionState.timerId = setTimeout(() => {
    speechMotionState.timerId = 0;
    runSpeechMotionLoop(token);
  }, Math.max(0, delayMs));
}

function waitForSpeechMotionFinish(token) {
  if (!speechMotionState.active || token !== speechMotionState.token) {
    return;
  }
  const elapsed = performance.now() - speechMotionState.lastStartedAt;
  if (isCurrentMotionFinished() || elapsed > 5200) {
    scheduleSpeechMotionNext(token, randomInt(450, 1200));
    return;
  }
  speechMotionState.pollId = setTimeout(() => {
    speechMotionState.pollId = 0;
    waitForSpeechMotionFinish(token);
  }, 240);
}

function runSpeechMotionLoop(token) {
  if (!speechMotionState.active || token !== speechMotionState.token) {
    return;
  }
  if (!actionReady || !model) {
    scheduleSpeechMotionNext(token, 500);
    return;
  }
  if (!isCurrentMotionFinished() && performance.now() - speechMotionState.lastStartedAt < 5200) {
    waitForSpeechMotionFinish(token);
    return;
  }

  const target = pickSpeechMotionTarget();
  log(`Speech motion trigger: ${target[0]}[${target[1]}]`);
  speechMotionState.lastStartedAt = performance.now();
  window.setMotion(target[0], target[1])
    .catch((e) => {
      log(`Speech motion error: ${e && e.message ? e.message : e}`);
    })
    .finally(() => {
      waitForSpeechMotionFinish(token);
    });
}

function startSpeechMotionLoop() {
  speechMotionState.active = true;
  speechMotionState.token += 1;
  speechMotionState.lastStartedAt = 0;
  clearSpeechMotionTimers();
  const token = speechMotionState.token;
  log('Speech motion loop started');
  scheduleSpeechMotionNext(token, randomInt(700, 1300));
}

function stopSpeechMotionLoop() {
  speechMotionState.active = false;
  speechMotionState.token += 1;
  clearSpeechMotionTimers();
  log('Speech motion loop stopped');
}

function rememberMotionName(name) {
  if (!name) {
    return;
  }
  recentMotionNames.push(name);
  if (recentMotionNames.length > 10) {
    recentMotionNames.shift();
  }
}

function scoreMotionForIntent(entry, profile) {
  const name = `${entry.name} ${entry.group} ${entry.file}`.toLowerCase();
  if ((profile.exclude || []).some((keyword) => name.includes(keyword))) {
    return -100;
  }
  let score = 0;
  (profile.include || []).forEach((keyword) => {
    if (name.includes(keyword)) {
      score += 10;
    }
  });
  if (!name.includes('face_')) {
    score += 2;
  }
  if (recentMotionNames.includes(entry.name)) {
    score -= 7;
  }
  return score;
}

function resolveMotionIntent(intent, mood) {
  const normalizedIntent = String(intent || '').trim().toLowerCase();
  const normalizedMood = String(mood || '').trim().toLowerCase();
  const profileKey =
    motionIntentAliases[normalizedIntent] ||
    motionIntentAliases[normalizedMood] ||
    'idle';
  const profile = motionIntentProfiles[profileKey] || motionIntentProfiles.idle;
  if (availableMotionEntries.length === 0) {
    return profile.fallback || ['Idle', 0];
  }
  const scored = availableMotionEntries
    .map((entry) => ({ entry, score: scoreMotionForIntent(entry, profile) }))
    .filter((item) => item.score > 0)
    .sort((a, b) => b.score - a.score);
  if (scored.length > 0) {
    const bestScore = scored[0].score;
    const top = scored.filter((item) => item.score >= bestScore - 4).slice(0, 18);
    const picked = pickRandom(top).entry;
    return [picked.group, picked.index, picked.name];
  }
  return profile.fallback || ['Idle', 0];
}

async function init() {
  try {
    lastInitError = null;
    log(`Init start, MODEL_URL=${MODEL_URL}`);
    log(`PIXI present=${!!window.PIXI}, version=${window.PIXI && window.PIXI.VERSION ? window.PIXI.VERSION : 'unknown'}`);
    log(`Live2D namespace present=${!!(window.PIXI && window.PIXI.live2d)}`);
    log(`Live2DCubismCore present=${!!window.Live2DCubismCore}`);

    if (!window.PIXI) {
      throw new Error('PIXI runtime is missing');
    }
    if (!window.PIXI.live2d || !window.PIXI.live2d.Live2DModel) {
      throw new Error('pixi-live2d cubism4 runtime is missing');
    }
    if (!window.Live2DCubismCore) {
      throw new Error('Live2D Cubism Core is missing');
    }

    log('Creating PIXI app...');
    app = new PIXI.Application({
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundAlpha: 0,
      antialias: true,
    });
    document.body.appendChild(app.view);
    log(`PIXI canvas attached, size=${app.screen.width}x${app.screen.height}`);

    const verification = await verifyRequiredResources();
    if (verification.missing.length > 0) {
      throw new Error(
        'Missing Cortana assets: ' + verification.missing.join(', ')
      );
    }

    log('Loading Live2D model...');
    configureLive2dMotionTiming();
    model = await PIXI.live2d.Live2DModel.from(MODEL_URL);
    log(`Live2D model loaded: ${model && model.internalModel && model.internalModel.settings ? model.internalModel.settings.name || 'unnamed' : 'unknown'}`);
    applyMotionFadeDefaultsToModelSettings();
    app.stage.addChild(model);
    modelLayoutMetrics = null;
    // 当前 vendor/pixi.min.js 是 Pixi 6，点击交互要用 interactive。
    model.interactive = true;
    model.buttonMode = true;
    model.cursor = 'pointer';
    model.on('hit', (hitAreas) => {
      log('Model hit: ' + hitAreas.join(', '));
      triggerPointerRandomMotion(`model-hit:${hitAreas.join(',') || 'unknown'}`);
    });
    app.view.addEventListener('pointerdown', () => {
      triggerPointerRandomMotion('canvas-pointer');
    });
    actionReady = true;
    log(
      `Action ready: expressions=${availableExpressionNames.length || Object.keys(defaultExpressionMap).length}, ` +
      `motions=${availableMotionEntries.length || Object.keys(motionMap).length}`
    );

    layoutModel();
    triggerStartupMotion();

    log(`Ready in ${Date.now() - initStartedAt}ms`);
    if (diagnosticsVisible) {
      setTimeout(() => {
        if (diagnosticsVisible) {
          statusEl.style.display = 'none';
        }
      }, 2000);
    }
  } catch (e) {
    const message = e && e.message ? e.message : String(e);
    lastInitError = {
      message,
      stack: e && e.stack ? e.stack : '',
      modelUrl: MODEL_URL,
      resolvedModelUrl,
      resourceStatuses: lastResourceStatuses,
    };
    log('Error: ' + message);
    console.error(e);
    if (e && e.stack) {
      appendDetail('STACK:\n' + e.stack);
      postToFlutter('[Cortana Stack] ' + e.stack);
    }
  }
}

// Flutter JS Bridge 接口
window.setExpression = async function setExpression(name) {
  log('setExpression: ' + name);
  if (!actionReady || !model) {
    log('Model not ready');
    return 'model-not-ready';
  }
  const mapped = resolveExpressionName(name);
  try {
    const result = await model.expression(mapped);
    log(`Expression applied: input=${name}, mapped=${mapped}, result=${result}`);
    return { ok: true, mapped, result };
  } catch (e) {
    log(`Expression error: input=${name}, mapped=${mapped}, message=${e && e.message ? e.message : e}`);
    throw e;
  }
};

function resolveExpressionName(name) {
  const input = String(name || '').trim();
  if ((input === '' || input.toLowerCase() === 'random') && availableExpressionNames.length > 0) {
    return pickRandom(availableExpressionNames);
  }
  const mapped = defaultExpressionMap[input] || input;
  if (availableExpressionNames.length === 0) {
    return mapped;
  }

  const lowerMapped = mapped.toLowerCase();
  const exact = availableExpressionNames.find((item) => item === mapped);
  if (exact) {
    return exact;
  }
  const caseInsensitive = availableExpressionNames.find(
    (item) => item.toLowerCase() === lowerMapped
  );
  if (caseInsensitive) {
    return caseInsensitive;
  }

  const semanticCandidates = {
    happy: ['happy', 'smile', 'joy', 'lianhong', 'bai'],
    sad: ['sad', 'sorry', 'yanlei', 'wuyu', 'buan'],
    surprised: ['surprised', 'excited', 'shengqi', 'qianqi', 'yanjing'],
  };
  const candidates = semanticCandidates[input] || [];
  for (const candidate of candidates) {
    const matched = availableExpressionNames.find(
      (item) => item.toLowerCase() === candidate
    );
    if (matched) {
      return matched;
    }
  }

  return availableExpressionNames[0];
}

window.setExpressionFor = async function setExpressionFor(name, holdMs, fallbackName) {
  const applied = await window.setExpression(name);
  const hold = Number.isFinite(holdMs) ? holdMs : parseInt(holdMs || '0', 10) || 0;
  const fallback = fallbackName || 'happy';
  if (hold > 0) {
    setTimeout(() => {
      window.setExpression(fallback).catch((e) => {
        log(`Expression fallback error: ${e && e.message ? e.message : e}`);
      });
    }, hold);
  }
  return applied;
};

window.setMotion = async function setMotion(group, index) {
  log('setMotion: ' + group + ', ' + index);
  if (!actionReady || !model) {
    log('Model not ready');
    return 'model-not-ready';
  }
  const mapped = resolveMotionTarget(group, index);
  const now = performance.now();
  if (
    lastQueuedMotion &&
    lastQueuedMotion.group === mapped[0] &&
    lastQueuedMotion.index === mapped[1] &&
    now - lastMotionRequestedAt < 260
  ) {
    log(`Motion skipped: input=${group}[${index}], mapped=${mapped[0]}[${mapped[1]}], reason=dedup`);
    return {
      ok: true,
      mappedGroup: mapped[0],
      mappedIndex: mapped[1],
      skipped: true,
    };
  }
  lastMotionRequestedAt = now;
  lastQueuedMotion = { group: mapped[0], index: mapped[1] };

  motionQueue = motionQueue
    .catch(() => {})
    .then(async () => {
      const isMotionSwitch =
        !lastAppliedMotion ||
        lastAppliedMotion.group !== mapped[0] ||
        lastAppliedMotion.index !== mapped[1];
      if (isMotionSwitch) {
        await new Promise((resolve) => setTimeout(resolve, 90));
      }
      try {
        const result = await model.motion(mapped[0], mapped[1]);
        lastAppliedMotion = { group: mapped[0], index: mapped[1] };
        rememberMotionName(mapped[2] || `${mapped[0]}[${mapped[1]}]`);
        log(`Motion applied: input=${group}[${index}], mapped=${mapped[0]}[${mapped[1]}], result=${result ? 'started' : 'empty'}`);
        return { ok: true, mappedGroup: mapped[0], mappedIndex: mapped[1] };
      } catch (e) {
        log(`Motion error: input=${group}[${index}], mapped=${mapped[0]}[${mapped[1]}], message=${e && e.message ? e.message : e}`);
        throw e;
      }
    });
  return motionQueue;
};

function resolveMotionTarget(group, index) {
  const rawGroup = String(group || '').trim();
  const lowerGroup = rawGroup.toLowerCase();
  const parsedIndex = Number.isFinite(index)
    ? index
    : parseInt(index || '0', 10) || 0;
  if ((rawGroup === '' || lowerGroup === 'random') && availableMotionEntries.length > 0) {
    const picked = pickRandom(availableMotionEntries);
    return [picked.group, picked.index, picked.name];
  }
  const mapped = motionMap[rawGroup];
  if (mapped) {
    const exactGroupEntries = availableMotionEntries.filter((item) => item.group === mapped[0]);
    if (exactGroupEntries.length > 0) {
      if (rawGroup !== mapped[0]) {
        const picked = pickRandom(exactGroupEntries);
        return [picked.group, picked.index, picked.name];
      }
      const safeIndex = Math.max(0, Math.min(parsedIndex, exactGroupEntries.length - 1));
      return [exactGroupEntries[safeIndex].group, exactGroupEntries[safeIndex].index, exactGroupEntries[safeIndex].name];
    }
    return mapped;
  }
  if (lowerGroup.startsWith('intent:')) {
    const parts = rawGroup.split(':');
    return resolveMotionIntent(parts[1] || 'idle', parts[2] || '');
  }
  if (motionIntentAliases[lowerGroup]) {
    return resolveMotionIntent(lowerGroup, '');
  }
  const exactName = availableMotionEntries.find((item) => item.name === rawGroup);
  if (exactName) {
    return [exactName.group, exactName.index, exactName.name];
  }
  const lowerName = availableMotionEntries.find(
    (item) => item.name.toLowerCase() === lowerGroup || item.file.toLowerCase().includes(lowerGroup)
  );
  if (lowerName) {
    return [lowerName.group, lowerName.index, lowerName.name];
  }
  const groupEntries = availableMotionEntries.filter(
    (item) => item.group.toLowerCase() === lowerGroup
  );
  if (groupEntries.length > 0) {
    const safeIndex = Math.max(0, Math.min(parsedIndex, groupEntries.length - 1));
    return [groupEntries[safeIndex].group, groupEntries[safeIndex].index, groupEntries[safeIndex].name];
  }
  return [rawGroup || 'Idle', parsedIndex];
}

function motionTargetFromEntry(entry) {
  return [entry.group, entry.index, entry.name];
}

function supportedMotionTargets() {
  if (availableMotionEntries.length > 0) {
    return availableMotionEntries.map(motionTargetFromEntry);
  }
  return Object.keys(motionMap).map((key) => {
    const target = motionMap[key];
    return [target[0], target[1], key];
  });
}

window.playAllMotionsOrdered = async function playAllMotionsOrdered() {
  const targets = supportedMotionTargets();
  log(`Play all motions ordered: count=${targets.length}`);
  for (const target of targets) {
    await window.setMotion(target[0], target[1]);
    await new Promise((resolve) => setTimeout(resolve, 1300));
  }
  return { ok: true, count: targets.length };
};

window.playRandomMotion = function playRandomMotion() {
  const targets = supportedMotionTargets();
  const target = pickRandom(targets);
  if (!target) {
    return Promise.resolve({ ok: false, reason: 'no-motion' });
  }
  log(`Play random motion: ${target[0]}[${target[1]}]`);
  return window.setMotion(target[0], target[1]);
};

window.setMotionIntent = function setMotionIntent(intent, mood, index) {
  const group = `intent:${intent || 'idle'}${mood ? ':' + mood : ''}`;
  return window.setMotion(group, index || 0);
};

function startLipSync(amp) {
  lipSyncState.target = clamp(Number(amp) || 0, 0, 1);
  ensureLipSyncLoop();
}

function stopLipSync() {
  lipSyncState.target = 0;
  ensureLipSyncLoop();
}

function setCostume(name) {
  log('setCostume skipped: local haru model has no costume variants');
}

window.setUserViewTransform = function setUserViewTransform(scale, offsetX, offsetY) {
  userViewState.scale = clamp(Number(scale) || 1, 0.6, 1.6);
  userViewState.offsetX = clamp(Number(offsetX) || 0, -0.45, 0.45);
  userViewState.offsetY = clamp(Number(offsetY) || 0, -0.4, 0.4);
  layoutModel();
  return {
    ok: true,
    userViewState: {
      scale: userViewState.scale,
      offsetX: userViewState.offsetX,
      offsetY: userViewState.offsetY,
    },
  };
};

window.setContainerMode = function setContainerMode(mode) {
  const normalized = mode === 'floating' ? 'floating' : 'fullscreen';
  containerViewState.mode = normalized;
  layoutModel();
  return { ok: true, mode: containerViewState.mode };
};

window.beginSpeechFocus = function beginSpeechFocus() {
  animateSpeechFocus(true);
  startSpeechMotionLoop();
  return { ok: true, active: true };
};

window.endSpeechFocus = function endSpeechFocus() {
  animateSpeechFocus(false);
  stopSpeechMotionLoop();
  return { ok: true, active: false };
};

window.setIdleFocus = function setIdleFocus(active) {
  animateIdleFocus(!!active);
  return { ok: true, active: !!active };
};

window.addEventListener('resize', () => {
  if (!app) return;
  app.renderer.resize(window.innerWidth, window.innerHeight);
  layoutModel();
});

window.addEventListener('error', (event) => {
  const message = event && event.message ? event.message : 'Unknown window error';
  log('Window error: ' + message);
  if (event && event.error && event.error.stack) {
    appendDetail('WINDOW STACK:\n' + event.error.stack);
  }
});

window.addEventListener('unhandledrejection', (event) => {
  const reason = event && event.reason ? (event.reason.message || String(event.reason)) : 'Unknown promise rejection';
  log('Unhandled rejection: ' + reason);
  if (event && event.reason && event.reason.stack) {
    appendDetail('REJECTION STACK:\n' + event.reason.stack);
  }
});

window.cortanaDebugState = () => ({
  pageUrl: window.location.href,
  baseUri: document.baseURI,
  pixiPresent: !!window.PIXI,
  pixiVersion: window.PIXI && window.PIXI.VERSION ? window.PIXI.VERSION : null,
  live2dPresent: !!(window.PIXI && window.PIXI.live2d && window.PIXI.live2d.Live2DModel),
  cubismCorePresent: !!window.Live2DCubismCore,
  appCreated: !!app,
  modelCreated: !!model,
  actionReady,
  modelUrl: MODEL_URL,
  resolvedModelUrl,
  elapsedMs: Date.now() - initStartedAt,
  lastInitError,
  lastResourceStatuses,
  userViewState: {
    scale: userViewState.scale,
    offsetX: userViewState.offsetX,
    offsetY: userViewState.offsetY,
  },
  speechFocusState: {
    active: speechFocusState.active,
    progress: speechFocusState.progress,
  },
  idleFocusState: {
    active: idleFocusState.active,
    progress: idleFocusState.progress,
  },
  lipSyncState: {
    current: lipSyncState.current,
    target: lipSyncState.target,
  },
  lastModelConfig,
  availableExpressions: availableExpressionNames,
  availableMotions: availableMotionEntries,
  lastLogs: detailLines.slice(-20),
});

window.setDiagnosticsVisible = function setDiagnosticsVisibility(visible) {
  applyDiagnosticsVisibility(visible);
  return { ok: true, visible: diagnosticsVisible };
};

applyDiagnosticsVisibility(false);
init();
</script>
